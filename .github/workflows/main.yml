name: Accurate Medical Center CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.12.0'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Generate Prisma Client
      run: npx prisma generate
      
    - name: Run Type Checking
      run: npx tsc --noEmit
      
    - name: Build Next.js Application
      run: npm run build
      env:
        # Dummy env vars needed for build if missing
        NEXT_TELEMETRY_DISABLED: 1
        
    - name: Test Docker Build
      run: docker build -f Dockerfile.local -t accurate-medical:test .
      
  # Deploy job can be added here (e.g., to AWS ECS, DigitalOcean, or Vercel)
